<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b2d31;color:#eee;font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}

.half{position:absolute;top:0;height:100%}

.page img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}

.spine-l::after,.spine-r::after{content:"";position:absolute;top:0;bottom:0;width:7%;pointer-events:none}
.spine-l::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.18),rgba(0,0,0,0))}
.spine-r::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.18),rgba(0,0,0,0))}
.leaf{position:absolute;top:0;height:100%;transform-style:preserve-3d;z-index:5;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face .shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.single .page{box-shadow:0 10px 30px rgba(0,0,0,.55)}

@media (max-width:600px){header .ttl small{display:none}header .ttl .full{display:none}#count{min-width:84px;font-size:13px}footer{gap:6px;padding-left:8px;padding-right:8px}.nav{padding:6px 11px}#toc{max-width:52vw}}

<body>
<div id="lock"><form id="lockform" autocomplete="on">
  <h1>Private <span>Preview</span></h1>
  <p>Private flipbook preview · Oct 10, 2026 (v22 – changes highlighted). Enter the password to open.</p>
  <input type="text" name="username" value="GYS preview" autocomplete="username" style="display:none" aria-hidden="true">
  <input type="password" id="pw" name="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <label><input type="checkbox" id="remember" checked> Remember on this device</label>
  <button type="submit" id="go">Open</button>
  <div id="bar"><i></i></div>
  <div id="msg" role="status"></div>
</form></div>
<div id="app">
<header>
  <div class="ttl"><span class="full">Private preview</span><span class="short">GYS</span> <small>Full preview v22 (B&amp;W, 10.5 pt) · Oct 10, 2026 · screen only, not for print</small></div>
  <select id="toc" aria-label="Table of contents"></select>
  <button id="fs" title="Fullscreen (F)" aria-label="Fullscreen">&#x26F6;</button>
  <button id="lockbtn" title="Lock and forget this device" aria-label="Lock">&#x1F512;</button>
</header>
<div id="memo" role="dialog" aria-live="polite"><button class="mx" aria-label="Close">&times;</button><div class="mh"></div><div class="mt"></div></div>
<div id="stage"><div id="book"></div><div id="hint">Swipe, use ← → keys, or click a page edge to turn</div></div>
<footer>
  <button class="nav" id="prev" aria-label="Previous">&#x2039;</button>
  <input type="range" id="slider" min="0" max="221" value="0" aria-label="Jump to page">
  <button class="nav" id="next" aria-label="Next">&#x203A;</button>
  <div id="count"></div>
</footer>
</div>
<script>const HOT = [];
function startBook(P, TOC, MEMO){
const N = P.length, LAST = N - 1, NINT = N - 2;            // real pages: 0 front cover, 1..252 interior, 253 back cover
const AR = 396 / 612;                                     // page aspect (5.5 x 8.5 in)
const SLOTS = N + 2;                                      // spread slots: 0 front, 1 inside front, 2..253 interior, 254 inside back, 255 back
const stage = document.getElementById('stage'), book = document.getElementById('book');
const slider = document.getElementById('slider'), count = document.getElementById('count'); slider.max = LAST;
const tocSel = document.getElementById('toc');
let cur = 0, spreadMode = true, W = 300, H = 460, busy = false, pending = null;

const src = r => P[r];
const label = r => r === 0 ? 'Front cover' : r === LAST ? 'Back cover' : 'p. ' + r;   // t98u: no changes-index pages
const slotOf = r => r === 0 ? 0 : r === LAST ? SLOTS - 1 : r + 1;
const realOf = s => s === 0 ? 0 : s === SLOTS - 1 ? LAST : (s >= 2 && s <= N - 1) ? s - 1 : (s === 1 || s === SLOTS - 2) ? 'blank' : null;
const spreadOf = r => Math.floor((slotOf(r) + 1) / 2);
const NSPREAD = Math.floor(SLOTS / 2) + 1;
const spreadSlots = sp => [2 * sp - 1, 2 * sp];
function firstReal(sp){ for (const s of spreadSlots(sp)) { const r = realOf(s); if (typeof r === 'number') return r; } return 0; }

// small decoded-image cache (only nearby pages are ever turned into <img>)
const cache = new Map();

    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' })); a.download = 'GYS-decisions-' + N.ver + '.txt'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); msg(N.exported); };
  rstB.onclick = () => { if (confirm(N.resetAsk)) { S = {}; save(); draw(); decorate(); msg(N.wasReset); } };
  // open / close (docks on wide screens; slide-over otherwise; never collides with the Notes panel)
  const fit = () => { const h = document.querySelector('header'), f = document.querySelector('footer'); document.documentElement.style.setProperty('--nt', (h ? h.getBoundingClientRect().bottom : 0) + 'px'); document.documentElement.style.setProperty('--nbm', (f ? window.innerHeight - f.getBoundingClientRect().top : 0) + 'px'); };
  function open(){ if (window.__notes && document.getElementById('npanel').classList.contains('open') && !both()) window.__notes.close(); fit(); P.classList.add('open'); btn.classList.add('on'); if (wide()) { document.body.classList.add('cdock'); window.dispatchEvent(new Event('resize')); } }
  function close(){ P.classList.remove('open'); btn.classList.remove('on'); if (document.body.classList.contains('cdock')) { document.body.classList.remove('cdock'); window.dispatchEvent(new Event('resize')); } if (P.contains(document.activeElement)) document.activeElement.blur(); }
  btn.addEventListener('click', () => P.classList.contains('open') ? close() : open());
  xb.addEventListener('click', close);
  window.addEventListener('resize', () => { if (!P.classList.contains('open')) return; fit(); const d = wide(); if (d !== document.body.classList.contains('cdock')) { document.body.classList.toggle('cdock', d); window.dispatchEvent(new Event('resize')); } });
  draw(); decorate();
  window.__changes = { open, close, build, tab, qBuild, qOpen, isOpen: () => P.classList.contains('open'), both };
};

<script>
(function(){
const CFG = {"id": "0e19efbcb23b", "bin": "book.0e19efbcb23b.bin", "size": 17355694, "iter": 600000, "salt": "Uiq5LfWXrZBZtuUOXXW7jg==", "ivc": "0kVzdMqS8MHW2lWw", "check": "HF0J3UgT21GRn7iHIHvId3SjAKUSNQ=="};
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const SALT = ub64(CFG.salt), IVC = ub64(CFG.ivc), CHECK = ub64(CFG.check);
const KEYNAME = 'gys-flipbook-key', LEGACY = 'gys-flipbook-key-';
const $ = id => document.getElementById(id);
const msg = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };
const enc = new TextEncoder();
let dl = null;
function store(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }

function download(){
  if (dl) return dl;
  dl = (async () => {
    const r = await fetch(CFG.bin + '?v=' + CFG.id);
    if (!r.ok) throw new Error('Download failed (' + r.status + ')');
    if (!r.body || !r.body.getReader) return new Uint8Array(await r.arrayBuffer());
    const total = CFG.size, out = new Uint8Array(total), rd = r.body.getReader(); let got = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break;
      if (got + value.length > out.length) throw new Error('Unexpected file size');
      out.set(value, got); got += value.length; dl.progress = got / total; if (dl.onprogress) dl.onprogress(dl.progress); }
    if (got !== total) throw new Error('Incomplete download (' + got + ' of ' + total + ' bytes)');
    return out;
  })();
  dl.progress = 0; dl.catch(() => { dl = null; });

}
async function deriveKey(pw){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: SALT, iterations: CFG.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);

async function verify(key){

}
async function openBook(key){
  $('go').disabled = true; $('bar').style.display = 'block';
  const bar = $('bar').firstElementChild;
  const d = download();
  const show = p => { bar.style.width = Math.round(p * 100) + '%'; msg('Loading the book… ' + Math.round(p * 100) + '%'); };
  d.onprogress = show; show(d.progress || 0);
  const buf = await d;
  msg('Unlocking…'); bar.style.width = '100%';
  await new Promise(r => setTimeout(r, 30));
  const t0 = performance.now();
  if (String.fromCharCode.apply(null, buf.subarray(0, 8)) !== 'GYSENC1\0') throw new Error('Bad file');

  if (hdr.ui && hdr.ui.notes && window.__initNotes) window.__initNotes(hdr.ui.notes);
  if (hdr.ui && hdr.ui.changes && window.__initChanges) window.__initChanges(hdr.changes, hdr.ui.changes, hdr.updates, hdr.questions);
}
async function unlock(pw, remember){
  msg('Checking password…');
  const key = await deriveKey(pw);
  if (!(await verify(key))) { msg('Wrong password. Please try again.', true); $('pw').select(); return; }
  if (remember) store(KEYNAME, b64(new Uint8Array(await crypto.subtle.exportKey('raw', key))));
  else store(KEYNAME, null);
  await openBook(key);
}
$('lockform').addEventListener('submit', e => {
  e.preventDefault(); $('pw').blur();
  unlock($('pw').value, $('remember').checked).catch(err => { $('go').disabled = false; msg((err && err.message) || 'Something went wrong', true); });
});
function legacyKeys(){ try { return Object.keys(localStorage).filter(k => k.indexOf(LEGACY) === 0); } catch (e) { return []; } }
$('lockbtn').addEventListener('click', () => { if (confirm('Lock the preview and forget the password on this device?')) { store(KEYNAME, null); legacyKeys().forEach(k => store(k, null)); location.hash = ''; location.reload(); } });
if (!(window.crypto && crypto.subtle)) { msg('This browser cannot open the preview (Web Crypto needs HTTPS and a current browser).', true); $('go').disabled = true; return; }

  try {
    for (const [name, saved] of cands) {

        msg('Welcome back…'); await openBook(key); return;
      }
      store(name, null);
    }
  } catch (err) { $('go').disabled = false; msg((err && err.message) || 'Something went wrong', true); }
})();
})();
